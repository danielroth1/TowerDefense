<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Vector Tower Defense</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #0a0a0f; }
      body {
        /* dvh avoids jumpy resizes from the mobile URL bar collapsing */
        position: fixed; inset: 0;
        width: 100%; height: 100dvh;
        /* Let the game own all gestures (pinch/pan); no browser zoom/scroll */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas { display: block; image-rendering: auto; touch-action: none; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
